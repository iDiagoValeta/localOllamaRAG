# Groups the notes GitHub generates for a release by the labels the issue
# standard declares (.github/labels.json). A PR with no matching label lands in
# "Other changes": label it, do not edit this file to catch it.
changelog:
  exclude:
    labels:
      - wontfix
      - duplicate
      - invalid
  categories:
    - title: Security
      labels: [security]
    - title: Fixed
      labels: [bug]
    - title: Added and changed
      labels: [enhancement, performance]
    - title: Evaluation and loop
      labels: [eval, loop]
    - title: Documentation
      labels: [documentation]
    - title: Cleanup
      labels: [cleanup]
    - title: Other changes
      labels: ["*"]
