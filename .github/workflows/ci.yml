name: CI

# Fast gate. Everything here runs on a hosted runner with no GPU, no Ollama and
# no model downloads, so it can gate every pull request without becoming the
# thing people skip. What it deliberately does NOT cover: the real retrieval
# pipeline end to end. That needs local models and lives in the full gate, and
# pretending otherwise would turn this workflow into a green light that means
# nothing.
#
# The jobs are ordered cheapest-first: a syntax error should not wait for a
# torch download to be reported.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff==0.14.10
      - name: Check
        run: ruff check --output-format=github .

  architecture:
    name: Architecture and pure logic
    runs-on: ubuntu-latest
    # No project dependencies on purpose: the domain, the ports, the
    # configuration and the grader may not touch infrastructure, so they must
    # pass with nothing but a test runner installed. If this job ever needs
    # FAISS or torch, a boundary has been crossed — which is what it exists
    # to detect.
    #
    # Tests that import the engine on purpose (adapters, and the equivalence
    # tests that compare against the original implementation) are skipped by
    # tests/conftest.py, which detects that the stack is absent. No path list
    # lives here: it would go stale the moment a test is added.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test runner
        run: pip install pytest
      - name: Run
        run: pytest tests/unit tests/eval -q --no-header

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    # The lockfile is the point of moving to pnpm, so it has to be enforced
    # somewhere: --frozen-lockfile fails if package.json and the lockfile ever
    # drift, which is what would happen the first time someone ran npm here.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # The action reads packageManager from the repository root by default,
          # and this project's package.json lives one level down.
          package_json_file: rag/web/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: rag/web/frontend/pnpm-lock.yaml
      - name: Install
        working-directory: rag/web/frontend
        run: pnpm install --frozen-lockfile
      - name: Type-check
        working-directory: rag/web/frontend
        run: pnpm run lint
      - name: Build
        working-directory: rag/web/frontend
        run: pnpm run build

  engine:
    name: Engine behaviour
    runs-on: ubuntu-latest
    needs: [lint, architecture]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install CPU torch first
        # sentence-transformers pulls torch in, and the default wheel carries
        # the whole CUDA stack (~2.5 GB) for a runner with no GPU. Claiming the
        # CPU build up front keeps the job in the minutes range.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: |
          pip install -r rag/requirements.txt
          pip install -r rag/web/requirements.txt
          pip install pytest
      - name: Run characterization and engine tests
        # The Ollama integration tests skip themselves when no server answers,
        # which is the case here by design.
        run: pytest -q --no-header
