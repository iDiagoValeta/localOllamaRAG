name: Branch policy

# The head/base pair of every PR must follow docs/standards/branches.md.
# The rule lives in tools/check_branch_policy.py (standard library only, unit
# tested) so the workflow is a thin caller and the policy can be changed with
# a test, not by editing YAML.

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check head and base
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: python tools/check_branch_policy.py "$HEAD_REF" "$BASE_REF"
