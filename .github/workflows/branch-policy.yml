name: Branch policy

# The head/base pair of every PR must follow docs/standards/branches.md.
# The rule lives in tools/check_branch_policy.py (standard library only, unit
# tested) so the workflow is a thin caller and the policy can be changed with
# a test, not by editing YAML.

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Check head and base
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: python tools/check_branch_policy.py "$HEAD_REF" "$BASE_REF"
