# Lint configuration.
#
# The rule set is deliberately narrow: pyflakes (F) and the syntax/runtime
# checks in E9 catch things that are actually broken, such as undefined names
# and dead imports, while style opinions stay out of the way. A linter that
# reports hundreds of cosmetic findings on an existing codebase gets muted, and
# a muted linter catches nothing. Unreachable code is not among those checks;
# tests/unit/test_no_unreachable_code.py owns that. RUF100 and ERA001 earn
# their place on top of that core: RUF100 rejects a `noqa` that silences
# nothing, because such a directive lies about the code it sits on and teaches
# readers to skim past the ones that matter, and ERA001 keeps commented-out
# code out of the source, where history already lives in git.

target-version = "py310"
line-length = 100

exclude = [
    ".venv-mineru",
    "rag/web/frontend",
]

[lint]
select = ["F", "E9", "RUF100", "ERA001"]

[lint.per-file-ignores]
# Re-exporting is the whole point of a facade: rag/chat_pdfs.py exists so that
# the CLI, the web layer and the tests can import the engine from one place.
"rag/chat_pdfs.py" = ["F401"]
"**/__init__.py" = ["F401"]
